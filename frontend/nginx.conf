worker_processes auto;
error_log /tmp/nginx_error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 42m;

  # Structured access log without Authorization / Cookie bodies
  log_format main '$remote_addr - $request_method $uri $status '
                  '$body_bytes_sent rt=$request_time';
  access_log /tmp/nginx_access.log main;

  upstream vibeprompt_api {
    server api:8000;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API reverse-proxy (TLS terminates upstream of this container)
    location /api/ {
      proxy_pass http://vibeprompt_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-API-Secret $http_x_api_secret;
      proxy_read_timeout 120s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
