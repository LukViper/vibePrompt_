# VibePrompt staging / production compose
# Usage:
#   cp deploy/env.production.example .env.production   # fill secrets locally — never commit
#   podman compose --env-file .env.production up -d --build
#   # or: docker compose --env-file .env.production up -d --build

name: vibeprompt

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vibeprompt-api:local
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_PATH: /data/vibeprompt.db
      KNOWLEDGE_UPLOAD_DIR: /data/knowledge/uploads
      SKILLS_DIR: /data/skills
      # CORS: set to your public HTTPS origin(s) in the env file
    volumes:
      - vibeprompt_data:/data
    ports:
      - "${API_PUBLISH_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H \"X-API-Secret: $$API_SECRET\" http://127.0.0.1:8000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    user: "10001:10001"
    read_only: false
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vibeprompt-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PUBLISH_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true

  # Optional one-shot backup helper (does not replace scheduled host backups)
  backup:
    image: vibeprompt-api:local
    profiles: ["backup"]
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.production}
    environment:
      DATABASE_PATH: /data/vibeprompt.db
      BACKUP_DIR: /data/backups
    volumes:
      - vibeprompt_data:/data
    user: "10001:10001"
    entrypoint:
      [
        "python",
        "/app/scripts/sqlite_backup.py",
        "--database",
        "/data/vibeprompt.db",
        "--backup-dir",
        "/data/backups",
        "--retain",
        "14",
      ]
    depends_on:
      api:
        condition: service_healthy

volumes:
  vibeprompt_data:
    # Project-scoped by default (e.g. vibeprompt_vibeprompt_data / vpverify_…)
    # Override only if you intentionally share one named volume across stacks:
    # name: vibeprompt_data
